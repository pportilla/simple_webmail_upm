name: Publish privacy policy

# Run manually after reviewing docs/privacy.html and enabling GitHub Pages.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: privacy-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public policy only
        run: |
          mkdir -p _site
          cp docs/privacy.html _site/privacy.html
          cp docs/privacy.html _site/index.html
          cp docs/acceptable-use.html _site/acceptable-use.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
