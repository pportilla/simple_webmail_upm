name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK, check release bundle and run unit tests
        run: ./gradlew --no-daemon --stacktrace -PunsignedRelease=true assembleDebug testDebugUnitTest lintRelease bundleRelease

      - name: Unit test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, re
          total = failures = errors = skipped = 0
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              head = open(path, encoding="utf-8").read(4000)
              m = re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"', head)
              if m:
                  t, s, f, e = map(int, m.groups())
                  total += t; skipped += s; failures += f; errors += e
          line = f"Unit tests: {total} run, {failures} failed, {errors} errors, {skipped} skipped"
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(f"### {line}\n")
          PY

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: upm-mail-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # A rolling pre-release so the newest APK always has the same direct download link:
      # https://github.com/<owner>/<repo>/releases/download/latest-debug/upm-mail-debug.apk
      - name: Publish APK to the latest-debug pre-release
        if: success() && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk upm-mail-debug.apk
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug upm-mail-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "UPM Mail - latest debug build" \
            --notes "Debug build of ${GITHUB_SHA::7} from branch ${GITHUB_REF_NAME}.

          To install: open this page on your Android phone, download upm-mail-debug.apk and open it (allow your browser to install unknown apps when asked). Newer builds install over older ones and keep your accounts."

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
